name: Responsiveness
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  budget:
    runs-on: ubuntu-latest
    name: 3,000-dataset budgets
    defaults:
      run:
        working-directory: editor
    steps:
      - name: Check out the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          submodules: true

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: 'editor/.nvmrc'
          cache: 'npm'
          cache-dependency-path: editor/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --only-shell chromium

      - name: Run the budget test
        run: npx playwright test responsiveness --grep @budget
        env:
          PERF: '1'
          CPU_THROTTLE: '4'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: responsiveness-report
          path: editor/playwright-report/
          retention-days: 30
