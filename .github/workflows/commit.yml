name: Commit
on: [push]

permissions:
  contents: read

env:
  NODE_VERSION: "18"

jobs:
  lint:
    runs-on: ubuntu-latest
    name: ESLint
    defaults:
      run:
        working-directory: editor
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: editor/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    name: TypeScript
    defaults:
      run:
        working-directory: editor
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: editor/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run type checking
        run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    name: Vitest
    defaults:
      run:
        working-directory: editor
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: editor/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test -- --run

  build:
    runs-on: ubuntu-latest
    name: Build
    defaults:
      run:
        working-directory: editor
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: editor/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: editor/dist/
          retention-days: 7

  test-browser:
    runs-on: ubuntu-latest
    name: Playwright
    needs: build
    defaults:
      run:
        working-directory: editor
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: editor/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --only-shell chromium

      - name: Run Playwright tests
        run: npm run test:browser

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: editor/playwright-report/
          retention-days: 30

      - name: Upload test traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: editor/test-results/
          retention-days: 30

  audit:
    runs-on: ubuntu-latest
    name: npm audit
    defaults:
      run:
        working-directory: editor
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: editor/package-lock.json

      - name: Run npm audit
        run: npm audit --audit-level=moderate
